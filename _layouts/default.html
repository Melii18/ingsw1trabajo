<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}BiblioStock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ingsw1trabajo/assets/estilo.css">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/ingsw1trabajo/">
      <svg class="book" viewBox="0 0 70 52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M35 12 C26 6 14 5 4 7 V44 C14 42 26 43 35 49 Z"/>
        <path d="M35 12 C44 6 56 5 66 7 V44 C56 42 44 43 35 49 Z"/>
        <path d="M10 15 C17 14 24 15 30 18 M10 22 C17 21 24 22 30 25 M10 29 C17 28 24 29 30 32" stroke-width="1"/>
        <path d="M40 18 C46 15 53 14 60 15 M40 25 C46 22 53 21 60 22 M40 32 C46 29 53 28 60 29" stroke-width="1"/>
      </svg>
      BiblioStock
    </a>
    <div class="topbar-right">
    <nav class="topnav">
      <a href="/ingsw1trabajo/"{% if page.url == "/" %} class="activo"{% endif %}>Inicio</a>
      <a href="/ingsw1trabajo/docs/conceptualizacion.html"{% if page.url contains "conceptualizacion" %} class="activo"{% endif %}>Conceptualización</a>
      <a href="/ingsw1trabajo/docs/analisis.html"{% if page.url contains "analisis" %} class="activo"{% endif %}>Análisis</a>
      <a href="/ingsw1trabajo/docs/diseno.html"{% if page.url contains "diseno" %} class="activo"{% endif %}>Diseño</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar entre modo claro y oscuro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
    </div>
  </div>
</header>

<main class="doc">
{{ content }}
</main>

<footer class="pie">
  <strong>BiblioStock</strong> &middot; Ingeniería de Software
</footer>

<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var raiz = document.documentElement;
    var actual = raiz.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var nuevo = actual === "dark" ? "light" : "dark";
    raiz.setAttribute("data-theme", nuevo);
    try { localStorage.setItem("tema", nuevo); } catch (e) {}
  });
</script>

</body>
</html>
